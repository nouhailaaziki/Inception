services:

  mariadb:
    build:
      context: ./requirements/mariadb
    image: mariadb
    container_name: mariadb
    restart: on-failure
    env_file: .env
    secrets:
      - db_root_password
      - db_password
    volumes:
      - db_data:/var/lib/mysql
    networks:
      - inception

  wordpress:
    build:
      context: ./requirements/wordpress
    image: wordpress
    container_name: wordpress
    restart: on-failure
    depends_on:
      - mariadb
    env_file: .env
    secrets:
      - db_password
      - wp_admin_password
      - wp_user_password
    volumes:
      - wp_data:/var/www/html
    networks:
      - inception

  nginx:
    build:
      context: ./requirements/nginx
    image: nginx
    container_name: nginx
    restart: on-failure
    depends_on:
      - wordpress
    env_file: .env
    ports:
      - "443:443"
    volumes:
      - wp_data:/var/www/html:ro
    networks:
      - inception

  # ---------------- bonus services ----------------

  redis:
    build:
      context: ./requirements/bonus/redis
    image: redis
    container_name: redis
    restart: on-failure
    networks:
      - inception

  ftp:
    build:
      context: ./requirements/bonus/ftp
    image: ftp
    container_name: ftp
    restart: on-failure
    env_file: .env
    secrets:
      - ftp_password
    ports:
      - "21:21"
      - "21000-21010:21000-21010"
    volumes:
      - wp_data:/var/www/html
    networks:
      - inception

  adminer:
    build:
      context: ./requirements/bonus/adminer
    image: adminer
    container_name: adminer
    restart: on-failure
    depends_on:
      - mariadb
    ports:
      - "8080:8080"
    networks:
      - inception

  portfolio:
    build:
      context: ./requirements/bonus/portfolio
    image: portfolio
    container_name: portfolio
    restart: on-failure
    ports:
      - "8081:8081"
    networks:
      - inception

  netdata:
    build:
      context: ./requirements/bonus/netdata
    image: netdata
    container_name: netdata
    restart: on-failure
    ports:
      - "19999:19999"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /sys/fs/cgroup:/host/sys/fs/cgroup:ro
    networks:
      - inception

networks:
  inception:
    name: inception
    driver: bridge

volumes:
  db_data:
    name: db_data
  wp_data:
    name: wp_data

secrets:
  db_root_password:
    file: ../secrets/db_root_password.txt
  db_password:
    file: ../secrets/db_password.txt
  wp_admin_password:
    file: ../secrets/wp_admin_password.txt
  wp_user_password:
    file: ../secrets/wp_user_password.txt
  ftp_password:
    file: ../secrets/ftp_password.txt
