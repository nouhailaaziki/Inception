worker_processes auto;
pid /run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;
    sendfile      on;

    server {
        listen 8081;
        server_name _;

        root  /var/www/portfolio;
        index index.html;

        location / {
            try_files $uri $uri/ =404;
        }
    }
}
